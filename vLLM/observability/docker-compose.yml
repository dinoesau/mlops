services:
  ## Mocked RAG application (embedding + vector search mocked)
  ## Talks to vLLM running on the host (no vllm-server container).
  rag-app:
    build:
      context: ./rag_app  # Builds the image using Dockerfile from the rag_app directory
    container_name: rag-app
    ports:
      - "8002:8002"  # FastAPI main API endpoint
      - "8001:8001"  # Prometheus metrics endpoint
    environment:
      - OTEL_EXPORTER_OTLP_ENDPOINT=grpc://jaeger:4317  # Send traces to Jaeger
      - VLLM_BASE_URL=http://gateway:8003  # All LLM traffic via token-aware gateway
      - RAG_LLM_TOKEN=poc-app-rag-prod-001  # Identified as app-rag/production in gateway metrics
      - MODEL_NAME=Qwen/Qwen2.5-0.5B-Instruct  # Must match the model served by local `vllm serve`
    extra_hosts:
      - "host.docker.internal:host-gateway"  # Resolve host gateway on Linux/Mac/Windows
    depends_on:
      - jaeger
      - gateway

  ## Token-aware gateway in front of host-run vLLM.
  ## Required because vLLM never exposes Bearer tokens in metrics/traces.
  gateway:
    build:
      context: ./gateway
    container_name: gateway
    ports:
      - "8003:8003"  # Gateway OpenAI-compatible API
      - "8004:8004"  # Gateway Prometheus metrics
    environment:
      - OTEL_EXPORTER_OTLP_ENDPOINT=grpc://jaeger:4317
      - VLLM_BASE_URL=http://host.docker.internal:8000
      - STRICT_AUTH=true
      - ALLOW_UNKNOWN_KEYS=false  # true = unknown keys pass as anomaly/anomaly
      # DEFAULT_KEYS in gateway.py is the source of truth (app-rag/production,
      # app-rag/staging, app-etl/production, free/client-a, disabled).
      # TOKEN_MAP and API_KEYS_JSON are optional overrides only.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - jaeger

  ## Jaeger: distributed tracing backend
  jaeger:
    image: jaegertracing/all-in-one:1.57  # Jaeger all-in-one image
    container_name: jaeger
    ports:
      - "16686:16686"   # Jaeger UI
      - "4317:4317"     # OTLP gRPC endpoint
      - "4318:4318"     # OTLP HTTP endpoint
      - "6831:6831/udp" # Jaeger agent UDP port
      - "6832:6832/udp"
      - "14250:14250"
      - "14268:14268"
      - "14269:14269"
      - "5778:5778"
      - "9411:9411"     # Zipkin compatible port

  ## Prometheus: metrics collector
  prometheus:
    image: prom/prometheus
    container_name: prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml  # Mount custom config
    ports:
      - "9090:9090"  # Prometheus UI and API
    extra_hosts:
      - "host.docker.internal:host-gateway"  # Allow scraping host-run vLLM at :8000/metrics

  ## Grafana: metrics dashboard and visualization
  grafana:
    image: grafana/grafana
    container_name: grafana
    ports:
      - "3000:3000"  # Grafana dashboard UI
    environment:
      - GF_SECURITY_ADMIN_USER=admin  # Default admin username
      - GF_SECURITY_ADMIN_PASSWORD=admin  # Default admin password
      - GF_INSTALL_PLUGINS=volkovlabs-echarts-panel  # Sankey project -> key -> model
    volumes:
      - grafana-storage:/var/lib/grafana  # Persist Grafana data
      - ./grafana/dashboards:/var/lib/grafana/dashboards  # Mount custom dashboards
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards  # Auto-provision dashboards
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources  # Auto-provision data sources
    depends_on:
      - prometheus
      - jaeger

volumes:
  grafana-storage:  # Named volume for persistent Grafana data